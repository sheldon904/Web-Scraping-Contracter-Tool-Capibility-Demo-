[project]
name = "creep"
version = "0.1.0"
description = "Contractor Risk Evaluation and Exploration Platform - Scan and assess risk for Florida contractors"
readme = "README.md"
authors = [
    { name = "sheldon904", email = "128750711+sheldon904@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx[http2]>=0.26",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13.7",
    "weasyprint>=60.0",
    "jinja2>=3.1",
    # Security floor: weasyprint -> fonttools pulls brotli. 1.2.1 fixes the
    # Brotli decoder out-of-bounds write CVE-2026-111497 ("Node2Shell").
    "brotli>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
creep = "creep.cli.commands:app"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
